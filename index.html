<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Splitter</title>
    <link rel="stylesheet" href="web/output.css">
    <script type="module" src="web/script.js"></script>
</head>
<body class="min-h-screen gradient-bg">
    <div class="mx-auto p-4 md:p-6 lg:p-8 max-w-7xl" >
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-12">
            <div class="text-center md:text-left mb-6 md:mb-0">
                <h1 class="text-6xl md:text-7xl font-bold mb-2 tracking-tight">
                    <span class="inline-block">$</span>Expense Splitter
                </h1>
                <p class="text-xl text-gray-800 font-light">
                    Split Expense with fried effortlessly
                </p>
            </div>
            <nav class="flex gap-3">
                <button 
                    class="btn-hover bg-yellow-700 hover:bg-yellow-600 hover:text-black text-white px-6 py-3 rounded-xl font-semibold drop-shadow-2xl">
                    Export
                </button>
                <button
                    class="btn-hover bg-yellow-700 hover:bg-yellow-600 hover:text-black text-white px-6 py-3 rounded-xl font-semibold drop-shadow-2xl">
                    Import
                </button>
            </nav>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <!-- add user form -->
            <form id="addUserForm" class="glass-effect p-8 rounded-2xl card-shadow">
                <h2 class="text-3xl font-bold text-gray-800 mb-6">Add Users</h2>
                <div class="space-y-4">
                    <input type="text" id="userInput"
                            placeholder="Enter User Name"
                            class="w-full border-2 border-gray-200 focus:border-blue-500 p-4 rounded-xl text-lg outline-none">
                    <button type="submit"
                            class="btn-hover bg-yellow-700 hover:bg-yellow-600 hover:text-black text-white px-6 py-3 rounded-xl font-semibold drop-shadow-2xl">
                        Add User
                    </button>
                </div>
            </form>

            <!-- add Expense details form -->
            <form id="addExpenseForm" class="glass-effect p-8 rounded-2xl card-shadow">
                <h2 class="text-3xl font-bold text-gray-800 mb-6">Add Expenses</h2>
                <div class="space-y-4">
                    <div>
                        <label >Who paid ?</label>
                        <select id="expenseUserInput" 
                            class="w-full border-2 border-gray-200 focus:border-blue-500 p-4 rounded-xl text-lg outline-none bg-white">

                        </select>
                    </div>
                    <div>
                        <label>Amount (Rs.)</label>
                        <input type="number" id="expenseAmountInput"
                            placeholder="e.g. 1000"
                            min="0" step="0.01"
                            class="w-full border-2 border-gray-200 focus:border-blue-500 p-4 rounded-xl text-lg outline-none">
                    </div>
                    <div>
                        <label>Description</label>
                        <input type="text" id="expenseReasonInput"
                            placeholder="e.g. Ice Cream"
                            class="w-full border-2 border-gray-200 focus:border-blue-500 p-4 rounded-xl text-lg outline-none">
                    </div>
                    <button type="submit"
                            class="btn-hover bg-yellow-700 hover:bg-yellow-600 hover:text-black text-white px-6 py-3 rounded-xl font-semibold drop-shadow-2xl">
                        Add Expense
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
